[package]
name = "wikibuilder"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "TontooOS offline wiki bundle builder"
authors = ["arlomu"]

[[bin]]
name = "wikibuilder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# TontooOS frameworks via direct paths (no SDK shim):
# ArchiveKit (Stored ZIP), FishFile (manifest.fico),
# Foundation (JSON, dates, lang files), NetworkKit (GitHub API HTTP).
# On-device and CI: /Library/System/*.
archivekit = { path = "/Library/System/ArchiveKit" }
fishfile = { path = "/Library/System/FishFile" }
foundation = { path = "/Library/System/Foundation" }
networkkit = { path = "/Library/System/NetworkKit" }
